version: '3.8'

services:
  faculty-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: faculty-dashboard
    restart: always
    ports:
      # Expose dashboard on Master node port 3000
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Optional runtime overrides for dashboard discovery / defaults
      - FAC_HOST=oracle-db
      - FAC_PORT=1522
      - FAC_USER=SYS
      - FAC_PASSWORD=LabDbPassword2026
      - FAC_SERVICE=FREEPDB1
    networks:
      - oracle_cluster_net

networks:
  oracle_cluster_net:
    external: true
