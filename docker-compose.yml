version: '3.8'

services:
  oracle-db:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: oracle-db
    restart: always
    ports:
      # Expose port 1522 strictly on the host's localhost (127.0.0.1)
      - "127.0.0.1:1522:1522"
    environment:
      # Mandatory: Sets password for SYS, SYSTEM, and PDBADMIN
      - ORACLE_PASSWORD=LabDbPassword2026
      # Default pluggable database name (defaults to FREEPDB1 if omitted)
      - ORACLE_DATABASE=FREEPDB1
      # Optional: automatically create a standard application/student user on startup
      - APP_USER=student
      - APP_USER_PASSWORD=StudentPassword123
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./init-db.sh:/container-entrypoint-startdb.d/01-init-db.sh:ro
    healthcheck:
      test: ["CMD", "/opt/oracle/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - oracle_cluster_net

volumes:
  oracle-data:

networks:
  oracle_cluster_net:
    external: true
