version: '3.8'

services:
  oracle-db:
    image: 192.168.1.10:5000/oracle-xe:latest
    environment:
      ORACLE_PASSWORD: "LabDbPassword2026"
      INIT_SGA_SIZE: "1500M"
      INIT_PGA_SIZE: "500M"
    ports:
      - target: 1521
        published: 1521
        protocol: tcp
        mode: host
        host_ip: 127.0.0.1
    networks:
      - admin_internal_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/opt/oracle/checkDBStatus.sh"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '2.0'
          memory: 3072M
        reservations:
          memory: 2048M

networks:
  admin_internal_net:
    external: true
